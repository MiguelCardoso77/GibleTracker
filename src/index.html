<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GibleTracker</title>
<link rel="icon" type="image/png" href="assets/Gible.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="nocturne-styles.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  *, *::before, *::after { box-sizing: border-box; }
  a { color: var(--color-accent-300); text-decoration: none; }
  a:hover { color: var(--color-accent-200); }
  *:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; pointer-events: none; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: transparent; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; pointer-events: auto; width: 13px; height: 13px; margin-top: -6px;
    border-radius: 50%; background: var(--color-bg); border: 1.5px solid var(--color-accent);
    cursor: grab; box-shadow: 0 0 0 3px rgba(145,132,217,.14);
  }
  input[type=range]::-webkit-slider-thumb:active { background: var(--color-accent-400); cursor: grabbing; }
  input[type=range]::-moz-range-thumb {
    pointer-events: auto; width: 13px; height: 13px; border-radius: 50%;
    background: var(--color-bg); border: 1.5px solid var(--color-accent);
  }
  input[type=range]::-moz-range-track { height: 2px; background: transparent; }

  select { -webkit-appearance: none; appearance: none; }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #3f424d; border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @keyframes ping { 0% { transform: scale(1); opacity: .55; } 70% { transform: scale(2.6); opacity: 0; } 100% { opacity: 0; } }
  @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: .9; } }

  .mono { font-family: 'JetBrains Mono', monospace; }

  #app-shell {
    height: 100vh; min-height: 640px; display: grid; grid-template-rows: auto 1fr auto;
    background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); font-size: 13px;
  }

  header {
    display: flex; align-items: center; gap: var(--space-6); padding: 0 var(--space-6);
    height: 52px; border-bottom: 1px solid var(--color-divider);
  }

  footer {
    display: flex; align-items: center; justify-content: center;
    height: 52px; border-top: 1px solid var(--color-divider);
  }
  #github-link {
    color: var(--color-neutral-400); font-family: var(--font-body); font-size: 13px;
    text-decoration: none; transition: color .15s ease;
  }
  #github-link:hover { color: var(--color-accent-300); }
  #brand-mark {
    width: 22px; height: 22px; border-radius: var(--radius-sm); object-fit: cover; display: block;
  }
  #wordmark { font-family: var(--font-heading); font-weight: 500; font-size: 15px; letter-spacing: -0.01em; }
  #header-spacer { flex: 1; }
  #pogo-hub-link {
    font-size: 11px; color: var(--color-neutral-400); text-decoration: none; transition: color .15s ease;
  }
  #pogo-hub-link:hover { color: var(--color-accent-300); }
  #body-grid { display: grid; grid-template-columns: minmax(0, 1fr) 372px; min-height: 0; }

  #main-column { min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }

  #map-pane {
    position: relative; flex: 1 1 auto; min-height: 120px; overflow: hidden;
    background: radial-gradient(120% 90% at 30% 20%, #1b1e30 0%, #141626 60%, #111322 100%);
  }
  #map-canvas { position: absolute; inset: 0; background: transparent; }
  #map-canvas .leaflet-tile-pane { filter: grayscale(1) invert(1) brightness(0.92) contrast(0.95); }
  #map-empty-overlay {
    position: absolute; inset: 0; display: grid; place-items: center; gap: var(--space-4);
    z-index: 900; pointer-events: none; background: radial-gradient(120% 90% at 30% 20%, #1b1e30 0%, #141626 60%, #111322 100%);
  }
  #map-empty-overlay[hidden] { display: none; }
  #map-placeholder-inner { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); }
  #map-glyph {
    width: 44px; height: 44px; border-radius: var(--radius-md); border: 1px solid var(--color-neutral-700);
    display: grid; place-items: center; color: var(--color-neutral-600); font-size: 18px;
  }
  #map-title { font-family: var(--font-heading); font-size: 20px; font-weight: 500; color: var(--color-neutral-400); letter-spacing: -0.01em; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #1b1e30; color: var(--color-text); }
  .leaflet-popup-content { font-family: var(--font-body); font-size: 12px; margin: 8px 10px; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--color-neutral-400); }
  .gible-user-dot { width: 14px; height: 14px; border-radius: 50%; background: #4ea1ff; border: 2px solid #0d1b2e; box-shadow: 0 0 0 4px rgba(78,161,255,.25); }

  .gible-sprite-icon {
    display: grid; place-items: center; border-radius: 50%; background: transparent;
    border: none; box-shadow: 0 1px 3px rgba(0,0,0,.5); cursor: pointer;
  }
  .gible-sprite-icon img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .gible-sprite-icon img.load-failed { display: none; }
  .gible-sprite-icon.selected { border: 1.5px solid var(--color-accent); background: rgba(145,132,217,.22); z-index: 1000 !important; }
  .gible-sprite-icon::after {
    content: '?'; display: none; font-size: 11px; font-weight: 700; color: var(--color-neutral-500);
  }
  .gible-sprite-icon:has(img.load-failed)::after { display: block; }

  aside#sidebar { min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--color-divider); background: #181a28; }

  #filters-block { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); border-bottom: 1px solid var(--color-divider); }
  .filter-field { display: flex; flex-direction: column; gap: var(--space-2); }
  .filter-label { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--color-neutral-500); }
  .select-wrap { position: relative; }
  .select-wrap select {
    width: 100%; padding: 8px 28px 8px 10px; border-radius: var(--radius-sm);
    background: var(--color-surface); border: 1px solid var(--color-neutral-800);
    color: var(--color-text); font-family: var(--font-body); font-size: 13px; cursor: pointer;
  }
  .select-caret { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--color-neutral-500); font-size: 10px; }

  .range-label-row { display: flex; justify-content: space-between; align-items: baseline; }
  .range-value-label { font-size: 11px; color: var(--color-accent-300); }
  .range-track-wrap { position: relative; height: 18px; }
  .range-rail { position: absolute; left: 0; right: 0; top: 8px; height: 2px; border-radius: 2px; background: var(--color-neutral-800); }
  .range-fill { position: absolute; top: 8px; height: 2px; border-radius: 2px; background: var(--color-accent); }
  .range-track-wrap input[type=range] { position: absolute; inset: 0; width: 100%; height: 18px; }

  #filter-actions-row { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-1); }
  #send-btn {
    flex: 1; padding: 9px 12px; border-radius: var(--radius-sm); background: transparent;
    border: 1px solid var(--color-accent); color: var(--color-accent-200);
    font-family: var(--font-body); font-size: 12px; font-weight: 500; cursor: pointer;
  }
  #send-btn:hover { background: rgba(145,132,217,.12); }
  #send-btn:active { background: rgba(145,132,217,.22); }
  #send-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  #results-region { flex: 1; min-height: 0; overflow-y: auto; }
  #results-header-row { padding: var(--space-6) var(--space-6) var(--space-4); display: flex; justify-content: space-between; align-items: baseline; }
  #results-count-label { font-family: var(--font-heading); font-size: 13px; font-weight: 500; }

  #results-grid {
    padding: 0 var(--space-6) var(--space-4);
    display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: var(--space-2);
  }
  .result-tile {
    aspect-ratio: 1; padding: 0; position: relative; display: grid; place-items: center;
    border-radius: var(--radius-sm); cursor: pointer; background: #20222f; border: 1px solid transparent;
  }
  .result-tile:hover { border-color: var(--color-accent-600); }
  .result-tile.selected { background: rgba(145,132,217,.16); border-color: var(--color-accent); }
  .result-tile img { width: 78%; aspect-ratio: 1; object-fit: contain; }
  .result-tile-dist { position: absolute; right: 2px; bottom: 1px; font-size: 8px; color: #75798c; }
  .result-tile.selected .result-tile-dist { color: #d2cefd; }
  .result-tile.iv100-match { border-color: #e0b84c; box-shadow: 0 0 0 1px #e0b84c inset; }
  .result-tile.iv100-match::after {
    content: 'Likely'; position: absolute; left: 2px; top: 1px; font-size: 7px; font-weight: 700;
    letter-spacing: .02em; color: #1a1608; background: #e0b84c; padding: 1px 3px; border-radius: 3px;
  }

  #detail-panel { margin: 0 var(--space-6) var(--space-6); padding: var(--space-6); border-radius: var(--radius-md); background: var(--color-surface); box-shadow: var(--shadow-sm); }
  #detail-panel.iv100-match { border: 1px solid #e0b84c; }
  #detail-top-row { display: flex; align-items: flex-start; gap: var(--space-4); }
  #detail-sprite { flex: none; width: 52px; height: 52px; }
  #detail-name-row { display: flex; align-items: center; gap: var(--space-2); }
  #detail-name { font-family: var(--font-heading); font-size: 16px; font-weight: 500; }
  #detail-form-pill { font-size: 10px; padding: 2px 6px; border-radius: 99px; border: 1px solid var(--color-accent-700); color: var(--color-accent-300); }
  #detail-meta-line { margin-top: 2px; font-size: 11px; color: var(--color-neutral-500); }
  #detail-close-btn {
    flex: none; width: 22px; height: 22px; border-radius: var(--radius-sm); border: 1px solid var(--color-neutral-800);
    background: transparent; color: var(--color-neutral-400); cursor: pointer; font-size: 11px;
  }
  #detail-close-btn:hover { border-color: var(--color-accent-700); color: var(--color-accent-300); }
  #detail-coords-block { margin-top: var(--space-6); padding-top: var(--space-4); border-top: 1px solid var(--color-divider); font-size: 11px; }
  #detail-coords-block .label { color: var(--color-neutral-500); font-size: 10px; }
  #detail-coords-block .value { margin-top: 2px; color: var(--color-neutral-200); }
  #copy-coords-btn {
    width: 100%; margin-top: var(--space-4); padding: 8px; border-radius: var(--radius-sm);
    background: transparent; border: 1px solid var(--color-neutral-800); color: var(--color-neutral-300);
    font-size: 11px; font-family: var(--font-body); cursor: pointer;
  }
  #copy-coords-btn:hover { border-color: var(--color-accent-700); color: var(--color-accent-200); }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="app-shell">
  <header>
    <img id="brand-mark" src="assets/Gible.png" alt="GibleTracker">
    <span id="wordmark">GibleTracker</span>
    <div id="header-spacer"></div>
    <a id="pogo-hub-link" class="mono" href="https://db.pokemongohub.net/" target="_blank" rel="noopener">Pokémon GO Hub</a>
  </header>

  <div id="body-grid">
    <div id="main-column">
      <section id="map-pane">
        <div id="map-canvas"></div>
        <div id="map-empty-overlay">
          <div id="map-placeholder-inner">
            <div id="map-glyph">&#9685;</div>
            <div id="map-title">No data yet</div>
          </div>
        </div>
      </section>

    </div>

    <aside id="sidebar">
      <div id="filters-block">
        <div class="filter-field">
          <label class="filter-label" for="area-selector">Area</label>
          <div class="select-wrap">
            <select id="area-selector">
              <option value="AgualvaCacem">Agualva-Cacém</option>
              <option value="Agueda">Águeda</option>
              <option value="Agueda2">Águeda 2</option>
              <option value="Almada">Almada</option>
              <option value="Amadora">Amadora</option>
              <option value="Amares">Amares</option>
              <option value="Barcelos">Barcelos</option>
              <option value="Braga">Braga</option>
              <option value="CanideloMadalena">Canidelo / Madalena</option>
              <option value="Carapeços">Carapeços</option>
              <option value="CarcavelosParede">Carcavelos / Parede</option>
              <option value="CarnaxideAlges">Carnaxide / Algés</option>
              <option value="Cascais">Cascais</option>
              <option value="Corroios">Corroios</option>
              <option value="Espinho">Espinho</option>
              <option value="Evora">Évora</option>
              <option value="GrandePorto">Grande Porto</option>
              <option value="Grijo">Grijó</option>
              <option value="MaiaGueifãesCasteloMaia">Maia / Gueifães / Castelo Maia</option>
              <option value="MatosinhosFozDouro">Matosinhos / Foz do Douro</option>
              <option value="Paredes">Paredes</option>
              <option value="RioTintoPedrouçosBaguim">Rio Tinto / Pedrouços / Baguim</option>
              <option value="SãoMamedeSenhoraHora">São Mamede / Senhora Hora</option>
              <option value="Valongo">Valongo</option>
              <option value="VilaConde">Vila do Conde</option>
              <option value="VilaNovaGaia">Vila Nova de Gaia</option>
            </select>
            <span class="select-caret">&#9662;</span>
          </div>
        </div>

        <div class="filter-field">
          <div class="range-label-row">
            <span class="filter-label">Level</span>
            <span id="level-range-label" class="range-value-label mono">1 – 35</span>
          </div>
          <div class="range-track-wrap">
            <div class="range-rail"></div>
            <div id="level-range-fill" class="range-fill"></div>
            <input type="range" id="level-min" min="1" max="35" value="1">
            <input type="range" id="level-max" min="1" max="35" value="35">
          </div>
        </div>

        <div id="filter-actions-row">
          <button id="send-btn">Search</button>
        </div>
      </div>

      <div id="results-region">
        <div id="results-header-row">
          <span id="results-count-label">0 Pokémon</span>
        </div>

        <div id="results-grid"></div>

        <div id="detail-panel" hidden>
          <div id="detail-top-row">
            <img id="detail-sprite" src="" alt="">
            <div style="min-width: 0; flex: 1;">
              <div id="detail-name-row">
                <span id="detail-name"></span>
                <span id="detail-form-pill"></span>
              </div>
              <div id="detail-meta-line" class="mono"></div>
            </div>
            <button id="detail-close-btn">&#10005;</button>
          </div>

          <div id="detail-coords-block" class="mono">
            <div class="label">COORDINATES</div>
            <div id="detail-coords-value" class="value"></div>
          </div>

          <button id="copy-coords-btn">copy coordinates</button>
        </div>
      </div>
    </aside>
  </div>

  <footer>
    <a id="github-link" href="https://github.com/MiguelCardoso77" target="_blank" rel="noopener">GitHub</a>
  </footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
